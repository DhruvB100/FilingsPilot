name: deploy

# 1. build the api image -> ghcr.io (free, uses GITHUB_TOKEN)
# 2. roll it out to container apps + upload the react build to the storage static website
#    (only when the repo variable DEPLOY_ENABLED=true, needs the AZURE_CREDENTIALS secret)
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ghcr image names have to be lowercase and my username isn't
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/filingspilot-api:latest
            ghcr.io/${{ env.OWNER }}/filingspilot-api:${{ github.sha }}

  rollout:
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: |
          az containerapp update -n filingspilot-api -g rg-filingspilot \
            --image ghcr.io/${{ github.repository_owner }}/filingspilot-api:${{ github.sha }}

  web:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az storage blob upload-batch --account-name ${{ vars.STORAGE_ACCOUNT }} -d '$web' -s web/dist --overwrite
